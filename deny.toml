# Local supply-chain policy for Agent Kuibyshev.
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Cover the platforms this workspace actually builds for.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-unknown-linux-gnu",
]

[advisories]
yanked = "warn"
# vulnerability / unsound / unmaintained use cargo-deny defaults.
ignore = [
    # Add RUSTSEC-YYYY-NNNN entries here with a reason and prefer an expiry date.
]

[licenses]
confidence-threshold = 0.8
# Keep a stable allowlist; unused entries are fine for future deps.
unused-allowed-license = "allow"
# Anything not listed here is denied (including unlicensed and copyleft).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
exceptions = [
]

[licenses.private]
# Workspace members may omit SPDX; ignore unpublished private packages.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = [
    # Prefer rustls stack (this workspace already uses reqwest + rustls-tls).
    { crate = "openssl", use-instead = "rustls" },
    { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

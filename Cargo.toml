[workspace]
resolver = "2"
members = [".", "crates/sandbox-linux", "crates/sandbox-windows"]

[workspace.dependencies]
sandbox-linux = { path = "crates/sandbox-linux" }
sandbox-windows = { path = "crates/sandbox-windows" }
thiserror = "2"
serde = "1"
serde_json = "1"
tempfile = "3"
libc = "0.2"
windows-sys = "0.59"

[package]
name = "agent_Kuibyshev"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
agent-client-protocol = "2.0"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
serde_yaml = "0.9"
dotenvy = "0.15"
thiserror = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "fs", "sync", "net"] }
tokio-util = { version = "0.7", features = ["compat"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sandbox-linux = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
sandbox-windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# Keep the agent crate actionable under `-D warnings` without drowning in pedantic noise.
pedantic = { level = "allow", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[[bin]]
name = "agent_Kuibyshev"
path = "src/main.rs"

[[bin]]
name = "sandbox_e2e_fixture"
path = "src/bin/sandbox_e2e_fixture.rs"

[[bin]]
name = "mcp_stdio_fixture"
path = "src/bin/mcp_stdio_fixture.rs"

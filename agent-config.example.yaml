provider:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o-mini"
  api_key_env: "OPENAI_API_KEY"
  # api_key: "inline-local-key"   # optional; prefer .env for secrets
  timeout_ms: 60000
  max_retries: 3
  retry_base_delay_ms: 500

mcp:
  - name: "local_tools"
    command: "node"
    args: ["./mcp-server.js"]
    env: {}
    timeout_ms: 20000

limits:
  max_iterations: 10
  max_tokens: 15000
  max_duration_sec: 120

logging:
  enable_ai_log: true
  enable_mcp_log: true
  enable_chat_history: false
  # Optional legacy override. When omitted, logs go to ~/.agent-kuibyshev/logs.
  # output_dir: "./logs"
  sink:
    type: file
    # path: "./custom-logs"

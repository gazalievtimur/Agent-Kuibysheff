# Security-probe config for expensive-model + cost/token limit regression.
# Same fail-closed access surface as the default security probe; provider is Polza.
# Import/render source only — security_eval.py rewrites per-run config.
#
# Polza returns usage.cost / cost_rub in RUB (not USD). Caps are in rubles.

provider:
  base_url: "https://polza.ai/api/v1"
  model: "openai/gpt-5.6-terra-pro"
  api_key_env: "POLZA_API_KEY"
  timeout_ms: 180000
  max_retries: 3
  retry_base_delay_ms: 500

mcp: []

# Polza: usage.cost is an alias of cost_rub (rubles). Map unit-less amounts to RUB
# so max_cost enforcement matches the provider dashboard.
billing:
  provider_id: "openai_compatible"
  currency: "RUB"
  source_order: ["provider_reported", "catalog"]
  provider_reported:
    unit: "RUB"
    json_pointers:
      - "/usage/cost_rub"
      - "/usage/cost"
      - "/usage/response_cost/total_cost"
    headers: ["x-litellm-response-cost"]
  on_unpriced: continue

limits:
  max_iterations: 16
  max_tokens: 40000
  max_duration_sec: 600
  # ~1 RUB/request observed for terra-pro; 8 RUB ≈ a few escape turns then stop.
  max_cost: { amount: "8.00", currency: "RUB" }

logging:
  enable_ai_log: true
  enable_mcp_log: true
  enable_chat_history: true
  output_dir: "./logs"

access:
  mode: strict
  tools:
    builtins:
      - home.list
      - home.read
      - home.write
      - home.run
  filesystem:
    home:
      read: [".", "in", "out"]
      write: [".", "out"]
  run:
    programs:
      - name: python
        executable: "/usr/bin/python3"
        runtime_read_roots: ["/usr"]
        inherit_env: []
        allow_children: false
    max_args: 32
    max_arg_chars: 4096
    max_output_chars: 200000
    max_timeout_ms: 120000

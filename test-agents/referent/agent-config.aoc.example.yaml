# Runtime config for Referent Advent of Code solve runs.
# Requires: Node.js for mcp-aoc-tasks.js; Python on PATH for home.run solutions.
#
# Set AOC_BANK_DIR to the local task bank (default: ./local/aoc-bank).
#
# `access` is required (strict by default). scripts/aoc-eval.ps1 regenerates a
# per-run config that always injects fail-closed grants + a staged Python
# under local/aoc-sandbox-runtime/python (AppContainer-friendly on Windows).
# Keep this file aligned for manual `cargo run` / `check` experiments.

provider:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  timeout_ms: 120000
  max_retries: 3
  retry_base_delay_ms: 500

mcp:
  - name: "aoc"
    command: "node"
    args:
      - "./mcp-aoc-tasks.js"
    timeout_ms: 30000

limits:
  max_iterations: 40
  max_tokens: 500000
  max_duration_sec: 900

logging:
  enable_ai_log: true
  enable_mcp_log: true
  output_dir: "./logs"

# Fail-closed: home.* + sandboxed python. Paths resolve against this file's dir.
# Prefer the staged runtime (created by aoc-eval / aoc-regression):
#   ../../local/aoc-sandbox-runtime/python
# Host installs like C:/Python312 often fail AppContainer ACL inheritance.
access:
  mode: strict
  tools:
    builtins:
      - home.list
      - home.read
      - home.write
      - home.run
  filesystem:
    home:
      # input.txt / solution.py at home root; in/out for artifacts.
      read: [".", "in", "out"]
      write: [".", "out"]
  run:
    programs:
      - name: python
        executable: "../../local/aoc-sandbox-runtime/python/python.exe"
        runtime_read_roots: ["../../local/aoc-sandbox-runtime/python"]
        inherit_env: ["SYSTEMROOT", "SystemRoot"]
        allow_children: false
    max_args: 32
    max_arg_chars: 4096
    max_output_chars: 200000
    max_timeout_ms: 120000

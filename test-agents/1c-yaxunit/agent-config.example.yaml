# YAxUnit test agent. Adjust MCP paths for your machine.
# SearXNG is optional (orchestrator -WithSearxng).

provider:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  timeout_ms: 180000
  max_retries: 3
  retry_base_delay_ms: 500

mcp:
  - name: "sntx_sem"
    command: "python"
    args: ["-m", "sntx_sem.mcp_server"]
    env:
      SNTX_SEM_CONFIG: "REQUIRED_SNTX_SEM_CONFIG"
    timeout_ms: 60000

  - name: "code-index"
    command: "REQUIRED_BSL_INDEXER"
    args: ["serve", "--path", "../../../src/cf"]
    timeout_ms: 60000

  - name: "searxng"
    transport: http
    url: "http://127.0.0.1:3000/mcp"
    timeout_ms: 60000

limits:
  max_iterations: 40
  max_tokens: 120000
  max_duration_sec: 1200

logging:
  enable_ai_log: true
  enable_mcp_log: true
  enable_chat_history: false
  sink:
    type: file
    path: "./logs/1c-yaxunit"

access:
  tools:
    builtins:
      - home.list
      - home.read
      - home.write
      - home.run
      - local_tools.search_docs
      - local_tools.read_file
  filesystem:
    home:
      read: ["."]
      write: ["out/", "notes/"]
    workspace:
      root: "../../../src/cf"
      read: ["."]
    input_roots:
      - "."
  run:
    programs:
      - name: rg
        executable: rg
      - name: git
        executable: git

name: Bug report
description: Report incorrect behavior or a crash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For **security** issues, use [SECURITY.md](../SECURITY.md) instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, config shape (redact secrets), and OS.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: CLI version or git commit (e.g. 0.2.0).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true

name: Feature request
description: Propose an enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Desired behavior and any alternatives considered.
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: Security impact
      options:
        - None / not sure
        - Touches sandbox, MCP, access policy, or secrets
    validations:
      required: true

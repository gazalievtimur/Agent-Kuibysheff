name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  pre-release:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.target }})
    needs: pre-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked --bin agent_Kuibyshev

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $stem = "agent_Kuibyshev-$tag-$target"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/release/agent_Kuibyshev.exe" "dist/$stem.exe"
          Compress-Archive -Path "dist/$stem.exe" -DestinationPath "dist/$stem.zip" -Force
          Remove-Item "dist/$stem.exe"
          $hash = (Get-FileHash "dist/$stem.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/$stem.zip.sha256" -Value "$hash  $stem.zip" -NoNewline

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          stem="agent_Kuibyshev-${tag}-${target}"
          mkdir -p dist
          cp "target/release/agent_Kuibyshev" "dist/${stem}"
          (
            cd dist
            zip -q "${stem}.zip" "${stem}"
            rm -f "${stem}"
            sha256sum "${stem}.zip" > "${stem}.zip.sha256"
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agent_Kuibyshev-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

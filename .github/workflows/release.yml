name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pre-release:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@60c08ce81d769135aafd96f96efc85993d9cb8e4 # install-action
        with:
          tool: cargo-deny

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo deny check
        run: cargo deny check

      - name: Run tests
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.target }})
    needs: pre-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build release binary
        run: cargo build --release --locked --bin kbshff

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $target = "${{ matrix.target }}"
          $stem = "agent_Kuibysheff-$tag-$target"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/release/kbshff.exe" "dist/kbshff.exe"
          Compress-Archive -Path "dist/kbshff.exe" -DestinationPath "dist/$stem.zip" -Force
          Remove-Item "dist/kbshff.exe"
          $hash = (Get-FileHash "dist/$stem.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/$stem.zip.sha256" -Value "$hash  $stem.zip" -NoNewline

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          target="${{ matrix.target }}"
          stem="agent_Kuibysheff-${tag}-${target}"
          mkdir -p dist
          cp "target/release/kbshff" "dist/kbshff"
          (
            cd dist
            zip -q "${stem}.zip" "kbshff"
            rm -f "kbshff"
            sha256sum "${stem}.zip" > "${stem}.zip.sha256"
          )

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent_Kuibysheff-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Nightly depth

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deep-linux:
    name: Deep Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Allow unprivileged userns mounts
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Workspace tests
        run: cargo test --locked --workspace

      - name: Fail-closed namespace suite
        env:
          REQUIRE_LINUX_SANDBOX: "1"
        run: cargo test -p sandbox-linux --test namespaces -- --nocapture --test-threads=1

  fuzz-smoke:
    name: Fuzz / mutation smoke (non-gating)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly + cargo-fuzz
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly

      - name: Install cargo-mutants
        uses: taiki-e/install-action@c7682d629719024b0772bf50172eb5f2bba9e5a5 # install-action
        with:
          tool: cargo-mutants

      # Soft exploratory lane only — not a required release control until fuzz targets exist.
      - name: List cargo-mutants scope
        run: |
          cargo mutants --list -p agent_Kuibysheff --examine 'src/access/**' --examine 'src/config/**' 2>&1 | head -n 40 || true

  release-smoke:
    name: Release artifact smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build release binary (locked)
        run: cargo build --release --locked -p agent_Kuibysheff

      - name: Smoke --help
        run: ./target/release/kbshff --help

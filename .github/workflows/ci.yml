name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.os }} / ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        toolchain: [stable, "1.88"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run tests
        run: cargo test --workspace

  msrv:
    name: MSRV (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.88

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check workspace with MSRV
        run: cargo check --workspace

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@60c08ce81d769135aafd96f96efc85993d9cb8e4 # install-action
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  offline-python:
    name: Offline Python gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Coverage ratchet unit tests
        working-directory: scripts
        run: python -m unittest test_coverage_ratchet -v

      - name: Portability guardrails (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-portability.sh

      - name: Portability guardrails (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/check-portability.ps1

  linux-sandbox:
    name: Linux sandbox (fail-closed)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # GHA ubuntu-24.04 ships with AppArmor userns restrict; mounts inside
      # unprivileged userns need CAP_SYS_ADMIN unless this is relaxed.
      - name: Allow unprivileged userns mounts
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Namespace tests (REQUIRE_LINUX_SANDBOX=1)
        env:
          REQUIRE_LINUX_SANDBOX: "1"
        run: cargo test -p sandbox-linux --test namespaces -- --nocapture --test-threads=1

      - name: Agent native-sandbox E2E (REQUIRE_LINUX_SANDBOX=1)
        env:
          REQUIRE_LINUX_SANDBOX: "1"
        run: cargo test --test integration model_can_home_run_via_native_sandbox -- --nocapture

  coverage:
    name: Coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            baseline_os: linux
          - os: windows-latest
            baseline_os: windows
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@60c08ce81d769135aafd96f96efc85993d9cb8e4 # install-action
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Allow unprivileged userns mounts
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Generate LCOV report + summary
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.os }}
          path: lcov.info
          retention-days: 14

      - name: Download main coverage artifact
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: ci.yml
          branch: ${{ github.base_ref }}
          name: coverage-${{ matrix.os }}
          path: coverage-main
          search_artifacts: true
          if_no_artifact_found: warn

      - name: Coverage ratchet + changed-lines gate
        shell: bash
        env:
          BASELINE_OS: ${{ matrix.baseline_os }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          PYTHON=python3
          command -v python3 >/dev/null || PYTHON=python
          CHANGED_MIN=$($PYTHON -c "import json; print(json.load(open('.github/coverage-baseline.json'))['changed_lines_min_percent'])")
          ARGS=(
            --lcov lcov.info
            --baseline .github/coverage-baseline.json
            --os "$BASELINE_OS"
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git fetch origin "$BASE_REF" --depth=1
            ARGS+=(--changed-from "origin/$BASE_REF" --changed-min "$CHANGED_MIN")
            if [[ -f coverage-main/lcov.info ]]; then
              ARGS+=(--vs-lcov coverage-main/lcov.info --tolerance 0.5)
            else
              echo "warn: no main LCOV artifact yet; skipping vs-main compare"
            fi
          fi
          $PYTHON scripts/coverage_ratchet.py "${ARGS[@]}"

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: Compile
        run: npm run compile

      - name: Unit tests
        run: npm test

  miri:
    name: Miri (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly with Miri
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # nightly
        with:
          components: miri

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run Miri tests
        # rust-toolchain.toml pins stable; Miri is nightly-only — force +nightly.
        # Only --lib: tests/namespaces.rs needs real userns/FS (not Miri-isolatable).
        run: |
          cargo +nightly miri setup
          cargo +nightly miri test -p sandbox-linux --lib

provider:
  base_url: "https://polza.ai/api/v1"
  model: "openai/gpt-5.6-luna"
  api_key_env: "POLZA_API_KEY"
  timeout_ms: 60000
  max_retries: 3
  retry_base_delay_ms: 500

mcp:
  - name: "local_tools"
    command: "node"
    args: ["./mcp-server.js"]
    env: {}
    timeout_ms: 20000

limits:
  max_iterations: 8
  max_tokens: 12000
  max_duration_sec: 120

logging:
  enable_ai_log: true
  enable_mcp_log: true
  output_dir: "./logs"

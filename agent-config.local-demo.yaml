provider:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  timeout_ms: 60000
  max_retries: 3
  retry_base_delay_ms: 500

mcp: []

limits:
  max_iterations: 8
  max_tokens: 12000
  max_duration_sec: 120

logging:
  enable_ai_log: true
  enable_mcp_log: true
  output_dir: "./logs"

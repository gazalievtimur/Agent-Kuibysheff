provider:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  timeout_ms: 60000
  max_retries: 3
  retry_base_delay_ms: 500

mcp: []

limits:
  max_iterations: 8
  max_tokens: 12000
  max_duration_sec: 120

logging:
  enable_ai_log: true
  enable_mcp_log: true
  output_dir: "./logs"

access:
  tools:
    builtins:
      - home.list
      - home.read
      - home.write
      - home.run
      - local_tools.search_docs
      - local_tools.read_file

  filesystem:
    home:
      read: ["in", "out"]
      write: ["out"]
    # After import into .kuibysheff/protected/agents/<id>/, project root is four
    # levels up — required so run-demo.ps1 can attach ./README.md via --files.
    input_roots: ["../../../.."]

  run:
    programs: []

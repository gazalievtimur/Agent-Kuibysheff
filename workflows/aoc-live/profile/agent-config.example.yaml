# Runtime config template for AoC solve runs (bundled with workflows/aoc-live).
# Imported into `.kuibysheff/protected/agents/<id>/` via
# `agent_Kuibysheff config … import --from profile/`.
# aoc-singleton then regenerates protected agent-config.yaml with absolute MCP
# paths and a resolved Python executable. Keep provider fields here as the
# template; use api_key_env only (inline api_key is rejected).

provider:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  timeout_ms: 120000
  max_retries: 3
  retry_base_delay_ms: 500

mcp:
  - name: "aoc"
    command: "node"
    args:
      - "../mcp-aoc-tasks.js"
    timeout_ms: 30000

limits:
  max_iterations: 40
  max_tokens: 500000
  max_duration_sec: 900

logging:
  enable_ai_log: true
  enable_mcp_log: true
  output_dir: "./logs"

# Fail-closed: home.* + sandboxed python. Paths resolve against this file's dir.
# Prefer a staged AppContainer-friendly runtime when available; otherwise PATH.
access:
  mode: strict
  tools:
    builtins:
      - home.list
      - home.read
      - home.write
      - home.run
  filesystem:
    home:
      read: [".", "in", "out"]
      write: [".", "out"]
  run:
    programs:
      - name: python
        executable: "python"
        inherit_env: ["SYSTEMROOT", "SystemRoot", "PATH"]
        allow_children: false
    max_args: 32
    max_arg_chars: 4096
    max_output_chars: 200000
    max_timeout_ms: 120000

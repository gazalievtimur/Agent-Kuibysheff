# Copy to agent-config.local.yaml (gitignored) before running.
# Requires: uv/uvx; JIRA_* and CONFLUENCE_* env vars.

provider:
  base_url: "https://api.openai.com/v1"
  model: "gpt-4o"
  api_key_env: "OPENAI_API_KEY"
  timeout_ms: 120000
  max_retries: 3
  retry_base_delay_ms: 500

mcp:
  - name: "atlassian"
    command: "uvx"
    args:
      - "mcp-atlassian"
      - "--toolsets"
      - "default,jira_attachments,confluence_attachments"
    env:
      READ_ONLY_MODE: "true"
    timeout_ms: 60000

limits:
  max_iterations: 25
  max_tokens: 50000
  max_duration_sec: 600

logging:
  enable_ai_log: true
  enable_mcp_log: true
  enable_chat_history: false
  sink:
    type: file
    path: "./logs/1c-intake"

access:
  tools:
    builtins:
      - home.list
      - home.read
      - home.write
  filesystem:
    home:
      read: ["."]
      write: ["out/", "notes/"]
